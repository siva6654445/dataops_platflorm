
name: Databricks Authentication Test

on:
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Test Databricks authentication
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set +x
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "ERROR: Required GitHub secrets are missing."
            exit 1
          fi

          response=$(curl -sS \
            -o response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.0/current-user/me")

          if [ "$response" = "200" ]; then
            echo "SUCCESS: Databricks authentication works."
          else
            echo "FAILED: Databricks returned HTTP $response."
            cat response.json
            exit 1
          fi
