name: 03 - Schema Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, uat, prd]
        required: true
        default: dev
      migration_version:
        description: Version or migration identifier
        type: string
        required: true
      dry_run:
        description: Preview only
        type: boolean
        required: true
        default: true

jobs:
  run:
    uses: ./.github/workflows/_reusable-operation.yml
    with:
      operation: schema_migration
      environment: ${{ inputs.environment }}
      migration_version: ${{ inputs.migration_version }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
