name: 01 - Infrastructure Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, uat, prd]
        required: true
        default: dev
      dry_run:
        description: Preview only (recommended first)
        type: boolean
        required: true
        default: true

jobs:
  run:
    uses: ./.github/workflows/_reusable-operation.yml
    with:
      operation: infra_deploy
      environment: ${{ inputs.environment }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
