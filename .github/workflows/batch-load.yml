name: 04 - Batch Load

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, uat, prd]
        required: true
        default: dev
      scope:
        description: Load mode
        type: choice
        options: [initial, incremental, repair]
        required: true
        default: incremental
      target:
        description: Dataset or Databricks job identifier
        type: string
        required: true
      dry_run:
        description: Preview only
        type: boolean
        required: true
        default: true

jobs:
  run:
    uses: ./.github/workflows/_reusable-operation.yml
    with:
      operation: batch_load
      environment: ${{ inputs.environment }}
      scope: ${{ inputs.scope }}
      target: ${{ inputs.target }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
