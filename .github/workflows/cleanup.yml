
name: 06 - Cleanup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - dev
          - uat
          - prd
        required: true
        default: dev

      catalogs:
        description: Catalog names, comma-separated
        type: string
        required: false
        default: ""

      schemas:
        description: Schema names as catalog.schema
        type: string
        required: false
        default: ""

      tables:
        description: Table names as catalog.schema.table
        type: string
        required: false
        default: ""

      volumes:
        description: Volume names as catalog.schema.volume
        type: string
        required: false
        default: ""

      dry_run:
        description: Preview only; keep true for the first run
        type: boolean
        required: true
        default: true

jobs:
  cleanup:
    uses: ./.github/workflows/_reusable-operation.yml
    with:
      operation: cleanup
      environment: ${{ inputs.environment }}
      catalogs: ${{ inputs.catalogs }}
      schemas: ${{ inputs.schemas }}
      tables: ${{ inputs.tables }}
      volumes: ${{ inputs.volumes }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
